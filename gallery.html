    <style>
        main{
            margin-bottom: 10px;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            
        }
        input{
            display: none;
        }
        #container{
            width: 100%;
            text-align: center;
        }
        h1{
            font-weight: normal;
            font-size: 35px;
            position: relative;
            margin: 40px 0;
        }
        h1::before{
            content: ' ';
            position: absolute;
            width: 100px ;
            height: 3px;
            background-color: rgb(36, 32, 33);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            animation: animate 4s linear infinite;
        }
        @keyframes animate{
            0%{
                width: 100px;
            }
            50%{
                width: 200px;
            }
            100%{
                width: 100px;
            }
        }
        .top-content{
            background-color: rgb(231, 229, 229);
            width: 90%;
            margin: 0 auto 20px auto ;
            height: 60px;
            display: flex;
            align-items: center;
            border-radius: 5px;
            
        }
        h3{
            height: 100%;
            background-color: rgb(192, 192, 192);
            line-height: 30px;
            padding: 0 50px;
        }
        label{
            display: inline-block;
            height:100% ;
            padding: 0 5px;
            margin: 0 10px;
            line-height: 20px;
            font-size: 18px;
            color: gray;
            cursor: pointer;
            transition: color.5s;
        }
        label:hover{
            color: lightgray;
        }
        .photo-gallery{
           width: 90%; 
           margin: auto;
           display: grid;
           grid-template-columns: repeat(4,1fr);
           grid-gap: 15px;
        }
        .pic{
            position: relative;
            height: 220px;
            border-radius: 5px;
            box-shadow: 3px 3px 5px lightgray;
            transition: .5s;
        }
        .pic img{
            width: 100% ;
            height: 100%;
            border-radius: 5px;
        }
        #check1:checked ~ #container .photo-gallery .pic{
            opacity: 1;
            transform: scale(1);
            position: relative;
            transition: .5s;
        }
        #check2:checked ~ #container .photo-gallery .wattle{
